services:
  # ── Python FastAPI — main production app ─────────────────────────────────
  - type: web
    name: tender-api
    runtime: python
    pythonVersion: "3.11"
    buildCommand: >-
      apt-get update &&
      apt-get install -y --no-install-recommends tesseract-ocr &&
      pip install --upgrade pip &&
      pip install -r Requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: GOOGLE_API_KEY
        sync: false   # set the real value in Render dashboard → Environment

  # ── Node.js Dummy Tender API — sandbox for testing ───────────────────────
  - type: web
    name: tender-sandbox
    runtime: node
    rootDir: dummyAPI        # Render will run everything from this subfolder
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_VERSION
        value: "20"