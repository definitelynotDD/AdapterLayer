# Railway.toml for dual-service deployment
# This file configures both services in one project

[build]
builder = "nixpacks"

# Service 1: FastAPI Adapter
[[services]]
name = "api-adapter"
runtime = "python"
startCommand = "python start.py"

[[services.variables]]
name = "PYTHONUNBUFFERED"
value = "1"

# Service 2: Node.js Dummy Tender API
[[services]]
name = "dummy-tender-api"
runtime = "node"
startCommand = "node server.js"

[[services.variables]]
name = "PORT"
value = "3000"

[[services.variables]]
name = "NODE_ENV"
value = "production"